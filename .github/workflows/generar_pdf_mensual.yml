name: Generar PDF Informe Mensual NOAA (Davis Vantage Pro2)

on:
  push:
    paths:
      - 'NOAAPRMO.TXT'
      - 'NOAAPRMO.txt'
      - '**/NOAAPRMO.TXT'
      - '**/NOAAPRMO.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generar informe PDF y actualizar catálogo historial
        run: |
          # Si el script está en la raíz o en una subcarpeta
          if [ -f "generar_pdf_noaa.py" ]; then
            python generar_pdf_noaa.py
          elif [ -f "Lajitas/generar_pdf_noaa.py" ]; then
            cd Lajitas && python generar_pdf_noaa.py && cd ..
          else
            # Buscar el script recursivamente
            SCRIPT=$(find . -name "generar_pdf_noaa.py" | head -n 1)
            DIR=$(dirname "$SCRIPT")
            cd "$DIR" && python generar_pdf_noaa.py && cd -
          fi

      - name: Confirmar y subir cambios (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.pdf informes.json || true
          git add **/*.pdf **/informes.json || true
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos para commitear."
          else
            git commit -m "Auto: Generación de informe PDF mensual NOAA [skip ci]"
            git push
          fi
